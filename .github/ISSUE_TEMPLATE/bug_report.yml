name: Bug Report
description: 报告一个 Bug
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间填写这个 Bug 报告!请尽可能详细地描述问题,帮助我们更快定位和修复。

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 清晰简洁地描述遇到的问题
      placeholder: 当我执行 X 操作时,发生了 Y 问题...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 详细的操作步骤,帮助我们复现问题
      placeholder: |
        1. 打开 '...'
        2. 点击 '...'
        3. 滚动到 '...'
        4. 看到错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望应该发生什么?
      placeholder: 我期望应用应该...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么?
      placeholder: 实际上应用...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或视频
      description: 如果可能,请提供截图或录屏
      placeholder: 拖拽图片到这里...

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      description: 问题发生在哪个平台?
      multiple: true
      options:
        - Android
        - iOS
        - 两者都有
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 在 "关于" 页面查看版本号
      placeholder: "例如: 0.1.0-alpha"
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: 系统版本
      description: 你的设备系统版本
      placeholder: "例如: Android 13, iOS 17.2"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备型号
      description: 你使用的设备型号
      placeholder: "例如: Pixel 7, iPhone 14 Pro"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 错误日志
      description: 如果应用崩溃,请提供日志信息
      placeholder: |
        运行 `flutter logs` 或从设备日志中复制错误信息
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他可能有助于解决问题的信息
      placeholder: |
        - 问题是否可稳定复现?
        - 是否在特定条件下出现?
        - 尝试过哪些解决方法?

  - type: checkboxes
    id: terms
    attributes:
      label: 确认事项
      description: 提交前请确认以下事项
      options:
        - label: 我已搜索过现有 Issue,确认这不是重复报告
          required: true
        - label: 我使用的是最新版本
          required: true
        - label: 我已阅读过文档和 FAQ
          required: true
