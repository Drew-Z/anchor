name: Feature Request
description: 提出新功能建议
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出功能建议!你的想法将帮助 Anchor Learning 变得更好。

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 这个功能请求解决什么问题?
      placeholder: 我在使用时遇到的困扰是...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你期望的功能是什么样的?
      placeholder: 我希望应用能够...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他可选方案
      description: 你考虑过哪些替代方案?
      placeholder: 另一种实现方式是...

  - type: dropdown
    id: category
    attributes:
      label: 功能类别
      description: 这个功能属于哪个模块?
      options:
        - 文档导入
        - 知识点管理
        - 题目生成
        - 答题和复习
        - Agent 学习
        - 数据同步
        - UI/UX
        - 性能优化
        - 国际化
        - 其他
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级 (你的看法)
      description: 这个功能对你有多重要?
      options:
        - 非常重要 (阻碍使用)
        - 重要 (显著改善体验)
        - 一般 (锦上添花)
        - 低 (可有可无)
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: 使用场景
      description: 描述具体的使用场景
      placeholder: |
        作为一名 [角色],
        我想要 [功能],
        这样我就能 [收益]。

  - type: textarea
    id: mockup
    attributes:
      label: UI 设计稿或示意图
      description: 如果涉及 UI 变更,可以提供草图或参考
      placeholder: 拖拽图片到这里,或描述 UI 布局...

  - type: textarea
    id: examples
    attributes:
      label: 参考示例
      description: 是否有其他应用实现了类似功能?
      placeholder: |
        - Anki 的 [功能]
        - Notion 的 [功能]

  - type: checkboxes
    id: terms
    attributes:
      label: 确认事项
      description: 提交前请确认
      options:
        - label: 我已搜索过现有 Issue,确认这不是重复建议
          required: true
        - label: 这个功能符合项目的核心理念 (可溯源、防幻觉、隐私优先)
          required: true
        - label: 我愿意参与讨论并提供更多细节
          required: true
        - label: 如果可能,我愿意贡献代码实现此功能
          required: false
