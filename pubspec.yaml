name: anchor_learning
description: "Anchor Learning - 锚定知识,溯源每一个洞见"
publish_to: 'none'
version: 1.0.0+2005

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  path_provider: ^2.1.4
  path: ^1.9.0
  dio: ^5.11.0
  receive_sharing_intent: ^1.8.1
  flutter_animate: ^4.5.0
  google_fonts: ^6.3.3
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  file_picker: ^12.0.0
  archive: ^4.1.0
  crypto: ^3.0.7
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2
  cross_file: ^0.3.4+2
  file_picker_platform_interface: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
