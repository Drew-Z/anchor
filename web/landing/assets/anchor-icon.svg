<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Anchor icon for Anchor Learning -->
  <defs>
    <linearGradient id="anchorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B8CFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7BA3FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Anchor shape -->
  <g fill="url(#anchorGradient)">
    <!-- Ring at top -->
    <circle cx="50" cy="20" r="8" fill="none" stroke="url(#anchorGradient)" stroke-width="4"/>

    <!-- Vertical shaft -->
    <rect x="46" y="20" width="8" height="45" rx="2"/>

    <!-- Horizontal bar (crossbar) -->
    <rect x="30" y="48" width="40" height="6" rx="2"/>

    <!-- Left fluke -->
    <path d="M 30 52 Q 20 55, 18 65 Q 17 70, 22 72 Q 27 74, 30 68 L 35 54 Z"/>

    <!-- Right fluke -->
    <path d="M 70 52 Q 80 55, 82 65 Q 83 70, 78 72 Q 73 74, 70 68 L 65 54 Z"/>

    <!-- Center point (stock) -->
    <circle cx="50" cy="65" r="5"/>
  </g>
</svg>
