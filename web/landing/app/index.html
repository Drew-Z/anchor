<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Demo - Anchor Learning</title>
  <meta name="description" content="Try the Anchor Learning source-traced quiz demo with bundled datasets.">
  <meta name="theme-color" content="#0b1210">
  <link rel="canonical" href="https://anchor.playlab.eu.cc/app/">
  <link rel="icon" type="image/svg+xml" href="../assets/anchor-icon.svg">
  <link rel="stylesheet" href="styles/app.css">
  <script type="module" src="scripts/app.js?v=20260829-2"></script>
</head>
<body data-surface="app">
  <a class="skip-link" href="#app-content" data-i18n="a11y.skip">Skip to content</a>
  <header class="app-header">
    <div class="app-brand">
      <img src="../assets/anchor-icon.svg" width="30" height="30" alt="">
      <div><strong>Anchor Learning</strong><span>DEMO</span></div>
    </div>
    <div class="app-header-actions">
      <a class="back-link" href="../">
        <span aria-hidden="true">←</span>
        <span data-i18n="app.back">Product site</span>
      </a>
      <div class="locale-switch" role="group" aria-label="Language" data-i18n-aria-label="a11y.language">
        <button type="button" data-locale="zh" aria-pressed="false">中文</button>
        <button type="button" data-locale="en" aria-pressed="true">EN</button>
      </div>
      <button id="dataset-menu-button" class="icon-button dataset-menu-button" type="button" aria-controls="dataset-sidebar" aria-expanded="false" aria-label="Open datasets" data-i18n-aria-label="app.menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="app-shell">
    <aside id="dataset-sidebar" class="app-sidebar" aria-label="Primary navigation" data-i18n-aria-label="a11y.primaryNav">
      <div class="sidebar-top">
        <button id="dataset-menu-close" class="icon-button sidebar-close" type="button" aria-label="Close datasets" data-i18n-aria-label="app.closeMenu">×</button>
      </div>

      <nav id="app-nav" class="app-nav"></nav>

      <div class="sidebar-block">
        <p class="eyebrow" data-i18n="app.datasets">Datasets</p>
        <nav id="dataset-list" class="dataset-list" aria-label="Datasets" data-i18n-aria-label="app.datasets"></nav>
      </div>

      <div id="sidebar-import" class="sidebar-block sidebar-import"></div>

      <!-- Rendered by the shell from SHELL_TEXT.privacy so the wording covers locally imported files too. -->
      <section id="privacy-note" class="privacy-note"></section>
      <button id="reset-progress" class="reset-button" type="button" data-reset-progress data-i18n="app.reset">Reset progress</button>
    </aside>

    <main id="app-content" class="app-content" tabindex="-1"></main>
  </div>

  <nav id="app-tabbar" class="app-tabbar"></nav>
  <div id="app-announcer" class="visually-hidden" role="status" aria-live="polite"></div>
</body>
</html>
